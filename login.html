<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Rental Transport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen flex items-center justify-center">
    <form id="loginForm" class="bg-white p-6 rounded shadow w-full max-w-sm">
      <h2 class="text-xl font-bold">Login</h2>
      <label class="block mt-4">
        <span class="text-sm">Email</span>
        <input id="loginEmail" type="email" required class="mt-1 p-2 border rounded w-full">
      </label>
      <label class="block mt-3">
        <span class="text-sm">Password</span>
        <input id="loginPassword" type="password" required class="mt-1 p-2 border rounded w-full">
      </label>
      <div class="mt-4 flex justify-between items-center">
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded">Login</button>
        <a href="signup.html" class="text-sm text-indigo-600">Create account</a>
      </div>
      <div id="loginMsg" class="mt-3 text-sm text-red-500"></div>
    </form>
  </div>
  <script>
document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault(); // default page reload rokta hai
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !email.includes("@")) {
    alert("Please enter a valid email.");
    return;
  }
  if (password.length < 6) {
    alert("Password must be at least 6 characters long.");
    return;
  }

  // Demo ke liye localStorage me save
  localStorage.setItem("loggedInUser", email);
  alert("Login successful!");
  window.location.href = "index.html"; // ya jis page pe jana hai
});
</script>


  <script src="script.js"></script>
</body>
</html>
        <label>
            <span class="text-sm font-medium">Email</span>
            <input id="email" name="email" type="email" class="mt-1 p-2 border rounded w-full" required>
        </label>
    
        <label>
            <span class="text-sm font-medium">Phone Number</span>
            <input id="phone" name="phone" type="tel" class="mt-1 p-2 border rounded w-full" required>
        </label>
    
        <button type="submit" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded">Confirm Booking</button>
        </form>
    </main>
    
    <footer class="bg-white border-t mt-12">
        <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
        <div class="text-sm">&copy; <span id="year4"></span> RentalTransport.</div>
        </div>
    </footer>
    
    <script src="script.js"></script>
    <script>document.getElementById('year4').textContent = new Date().getFullYear();</script>
